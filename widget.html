<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OBS Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: transparent;
      width: 420px;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    /* ── TIMER ── */
    #timer-block { display: none; flex-direction: column; align-items: center; margin-bottom: 24px; }

    .timer-pill {
      background: #0a1128;
      border: 1px solid rgba(0,210,255,0.4);
      border-radius: 50px;
      padding: 12px 32px;
      display: flex;
      width: 390px;          /* fixed — never resizes */
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 8px rgba(0,210,255,0.08);
      margin-bottom: 8px;
      transition: all 0.3s ease;
    }

    /* Theme Variations */
    .timer-pill.theme-gold { background: #1a1600; border-color: rgba(255,215,0,0.65); box-shadow: 0 0 20px rgba(255,215,0,0.22); }
    .timer-pill.theme-gold #timer-display { color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.6); }

    .timer-pill.theme-red { background: #20050a; border-color: rgba(255,77,109,0.65); box-shadow: 0 0 20px rgba(255,77,109,0.22); }
    .timer-pill.theme-red #timer-display { color: #ffffff; text-shadow: 0 0 10px rgba(255,77,109,0.6); }

    .timer-pill.theme-emerald { background: #041a12; border-color: rgba(0,255,136,0.65); box-shadow: 0 0 20px rgba(0,255,136,0.22); }
    .timer-pill.theme-emerald #timer-display { color: #00ff88; text-shadow: 0 0 10px rgba(0,255,136,0.6); }

    .timer-pill.theme-purple { background: #180829; border-color: rgba(168,85,247,0.65); box-shadow: 0 0 20px rgba(168,85,247,0.22); }
    .timer-pill.theme-purple #timer-display { color: #f0abfc; text-shadow: 0 0 10px rgba(168,85,247,0.6); }

    .timer-pill.theme-clean { background: #111827; border-color: rgba(255,255,255,0.25); box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    .timer-pill.theme-clean #timer-display { color: #ffffff; text-shadow: none; }

    #timer-display {
      font-family: 'Orbitron', monospace;
      font-size: 42px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 6px rgba(0,210,255,0.35);
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Fixed-width slots so no digit ever shifts its neighbours */
    .t-digit {
      display: inline-block;
      width: 0.82em;       /* wide enough for any Orbitron digit with spacing */
      text-align: center;
      margin: 0 1px;
    }
    .t-sep {
      display: inline-block;
      width: 0.42em;
      text-align: center;
      margin: 0 1px;
    }

    #timer-display.urgent {
      color: #ff4d6d;
      text-shadow: 0 0 12px #ff4d6d;
      animation: blink 0.5s ease-in-out infinite;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

    #promo-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      text-align: center;
    }

    .promo-line {
      display: flex;
      gap: 6px;
      align-items: baseline;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ── DONORS ── */
    #donator-block { display: none; width: 200px; }

    .list-header {
      background: #0a1128;
      border: 1px solid rgba(0,210,255,0.3);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      box-shadow: 0 0 15px rgba(0,210,255,0.1);
      transition: all 0.3s ease;
    }
    .list-header-title {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 4px;
      color: #00d2ff;
      text-transform: uppercase;
      text-shadow: 0 0 8px #00d2ff;
      transition: all 0.3s ease;
    }

    #donators-list { display: flex; flex-direction: column; gap: 8px; }

    .donor-card {
      background: linear-gradient(135deg, #1f1a00 0%, #0f172a 80%);
      border: 1px solid rgba(255,215,0,0.4);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
      animation: slideIn 0.5s ease both;
      transition: all 0.3s ease;
    }

    /* Donor Block Theme Variations */
    #donator-block.theme-gold .list-header { background: #1a1600; border-color: rgba(255,215,0,0.5); box-shadow: 0 0 15px rgba(255,215,0,0.15); }
    #donator-block.theme-gold .list-header-title { color: #ffd700; text-shadow: 0 0 8px #ffd700; }
    #donator-block.theme-gold .donor-card { background: linear-gradient(135deg, #2a2200 0%, #100e00 80%); border-color: rgba(255,215,0,0.5); }
    #donator-block.theme-gold .donor-rank { color: #ffd700; text-shadow: 0 0 10px #ffd700; }
    #donator-block.theme-gold .donor-amount { border-color: #ffd700; color: #ffd700; }

    #donator-block.theme-red .list-header { background: #20050a; border-color: rgba(255,77,109,0.5); box-shadow: 0 0 15px rgba(255,77,109,0.15); }
    #donator-block.theme-red .list-header-title { color: #ff4d6d; text-shadow: 0 0 8px #ff4d6d; }
    #donator-block.theme-red .donor-card { background: linear-gradient(135deg, #330712 0%, #0f0205 80%); border-color: rgba(255,77,109,0.5); }
    #donator-block.theme-red .donor-card::before { background: #ff4d6d; box-shadow: 0 0 10px #ff4d6d; }
    #donator-block.theme-red .donor-rank { color: #ff4d6d; text-shadow: 0 0 10px #ff4d6d; }
    #donator-block.theme-red .donor-amount { border-color: #ff4d6d; color: #ff4d6d; }

    #donator-block.theme-emerald .list-header { background: #041a12; border-color: rgba(0,255,136,0.5); box-shadow: 0 0 15px rgba(0,255,136,0.15); }
    #donator-block.theme-emerald .list-header-title { color: #00ff88; text-shadow: 0 0 8px #00ff88; }
    #donator-block.theme-emerald .donor-card { background: linear-gradient(135deg, #062b1e 0%, #020f0a 80%); border-color: rgba(0,255,136,0.5); }
    #donator-block.theme-emerald .donor-card::before { background: #00ff88; box-shadow: 0 0 10px #00ff88; }
    #donator-block.theme-emerald .donor-rank { color: #00ff88; text-shadow: 0 0 10px #00ff88; }
    #donator-block.theme-emerald .donor-amount { border-color: #00ff88; color: #00ff88; }

    #donator-block.theme-purple .list-header { background: #180829; border-color: rgba(168,85,247,0.5); box-shadow: 0 0 15px rgba(168,85,247,0.15); }
    #donator-block.theme-purple .list-header-title { color: #f0abfc; text-shadow: 0 0 8px #f0abfc; }
    #donator-block.theme-purple .donor-card { background: linear-gradient(135deg, #2a0e47 0%, #0d0417 80%); border-color: rgba(168,85,247,0.5); }
    #donator-block.theme-purple .donor-card::before { background: #f0abfc; box-shadow: 0 0 10px #f0abfc; }
    #donator-block.theme-purple .donor-rank { color: #f0abfc; text-shadow: 0 0 10px #a855f7; }
    #donator-block.theme-purple .donor-amount { border-color: #a855f7; color: #f0abfc; }

    #donator-block.theme-clean .list-header { background: #111827; border-color: rgba(255,255,255,0.25); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    #donator-block.theme-clean .list-header-title { color: #ffffff; text-shadow: none; }
    #donator-block.theme-clean .donor-card { background: #1f2937; border-color: rgba(255,255,255,0.2); }
    #donator-block.theme-clean .donor-card::before { background: #ffffff; box-shadow: none; }
    #donator-block.theme-clean .donor-rank { color: #ffffff; text-shadow: none; }
    #donator-block.theme-clean .donor-amount { border-color: rgba(255,255,255,0.3); color: #ffffff; }
    .donor-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: #ffd700;
      box-shadow: 0 0 10px #ffd700;
    }
    @keyframes slideIn { from{opacity:0;transform:translateX(-20px)} to{opacity:1;transform:translateX(0)} }

    .donor-rank {
      font-family: 'Orbitron', monospace;
      font-size: 15px;
      font-weight: 900;
      color: #ffd700;
      text-shadow: 0 0 10px #ffd700;
      width: 24px;
      text-align: center;
      flex-shrink: 0;
    }
    .donor-info { flex: 1; min-width: 0; }
    .donor-name {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .donor-amount {
      background: rgba(0,0,0,0.3);
      border: 1px solid #ffd700;
      border-radius: 6px;
      padding: 4px 10px;
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      font-weight: 700;
      color: #ffd700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .empty-state {
      text-align: center;
      padding: 30px;
      color: #94a3b8;
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
    }

    /* next.js build indicator — hide in OBS */
    #next-build-indicator, nextjs-portal { display: none !important; }
  </style>
</head>
<body>

<div id="timer-block">
  <div class="timer-pill">
    <!-- 8 fixed slots: H H : M M : S S -->
    <div id="timer-display">
      <span class="t-digit" id="td0">0</span><span class="t-digit" id="td1">0</span><span class="t-sep">:</span><span class="t-digit" id="td2">0</span><span class="t-digit" id="td3">0</span><span class="t-sep">:</span><span class="t-digit" id="td4">0</span><span class="t-digit" id="td5">0</span>
    </div>
  </div>
  <div id="promo-block"></div>
</div>

<div id="donator-block">
  <div class="list-header">
    <span class="list-header-title">TOP SUPPORTERS</span>
  </div>
  <div id="donators-list">
    <div class="empty-state">NO DONATORS YET</div>
  </div>
</div>

<script>
  const urlParams   = new URLSearchParams(window.location.search);
  const ROOM        = urlParams.get('room') || 'default';
  const WIDGET_TYPE = urlParams.get('type'); // 'timer' | 'donors' | null

  // Try to resolve the API base — if this file is served from the same origin as Next.js, use relative URL
  const API_BASE = '';  // leave empty = relative to current origin

  let lastUpdatedAt = 0;
  let endTimeRef    = null;
  let localRunning  = false;
  let tickInterval  = null;
  let state         = null;

  function pad(n) { return String(n).padStart(2, '0'); }
  function fmt(secs) {
    secs = Math.max(0, secs);
    const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60), s = secs % 60;
    return `${pad(h)}:${pad(m)}:${pad(s)}`;
  }
  function fmtAmt(n) { return '₹' + Number(n).toLocaleString('en-IN'); }

  // ── FETCH STATE ──────────────────────────────────────────────────────────────
  async function fetchState() {
    try {
      const res  = await fetch(`${API_BASE}/api/state?room=${ROOM}`, { cache: 'no-store' });
      const data = await res.json();
      if (data.updatedAt !== lastUpdatedAt) {
        lastUpdatedAt = data.updatedAt;
        state = data;
        applyState(data);
      }
    } catch(e) { console.warn('fetchState error', e); }
  }

  // ── APPLY STATE ──────────────────────────────────────────────────────────────
  function applyState(data) {
    // Timer visibility & theme
    const showTimer  = WIDGET_TYPE !== 'donors' && data.showTimer;
    const showDonors = WIDGET_TYPE !== 'timer'  && data.showDonors;
    document.getElementById('timer-block').style.display   = showTimer  ? 'flex' : 'none';
    document.getElementById('donator-block').style.display = showDonors ? 'block' : 'none';

    const pill = document.querySelector('.timer-pill');
    if (pill) {
      pill.className = 'timer-pill' + (data.theme && data.theme !== 'default' ? ' theme-' + data.theme : '');
    }
    const donorBlock = document.getElementById('donator-block');
    if (donorBlock) {
      donorBlock.className = (data.theme && data.theme !== 'default' ? 'theme-' + data.theme : '');
    }

    // Timer value
    if (data.timer.running && data.timer.targetEndTime) {
      endTimeRef   = data.timer.targetEndTime;
      localRunning = true;
      const secs = Math.max(0, Math.ceil((data.timer.targetEndTime - Date.now()) / 1000));
      setTimerDisplay(secs, localRunning);
    } else {
      endTimeRef   = null;
      localRunning = data.timer.running;
      setTimerDisplay(data.timer.remaining, localRunning);
    }
    startLocalTick();

    // Promo text
    renderPromo(data);

    // Donors
    renderDonors(data);
  }

  // ── TIMER DISPLAY ────────────────────────────────────────────────────────────
  // Digit slot IDs: td0 td1 (hours) td2 td3 (mins) td4 td5 (secs)
  const DIGIT_SLOTS = ['td0','td1','td2','td3','td4','td5'];

  function setTimerDisplay(secs, running) {
    const str = fmt(secs); // "HH:MM:SS"
    // str chars: [0]=H [1]=H [2]=: [3]=M [4]=M [5]=: [6]=S [7]=S
    // slots map to indices 0,1,3,4,6,7 (skip colons at 2 and 5)
    const digits = [str[0], str[1], str[3], str[4], str[6], str[7]];
    digits.forEach((ch, i) => {
      const el = document.getElementById(DIGIT_SLOTS[i]);
      if (el && el.textContent !== ch) el.textContent = ch; // update only if changed
    });

    const disp = document.getElementById('timer-display');
    if (secs <= 30 && running) {
      disp.classList.add('urgent');
    } else {
      disp.classList.remove('urgent');
    }
  }

  function startLocalTick() {
    if (tickInterval) clearInterval(tickInterval);
    if (!localRunning) return;
    tickInterval = setInterval(() => {
      const secs = endTimeRef
        ? Math.max(0, Math.ceil((endTimeRef - Date.now()) / 1000))
        : 0;
      setTimerDisplay(secs, localRunning);
      if (secs <= 0) {
        localRunning = false;
        clearInterval(tickInterval);
        tickInterval = null;
      }
    }, 200);
  }

  // ── PROMO TEXT ───────────────────────────────────────────────────────────────
  let lastPromoKey = null; // cache key — skip re-render if nothing changed

  function getCssFont(font) {
    if (!font || font === 'Rajdhani') return "'Rajdhani', sans-serif";
    if (font === 'Orbitron') return "'Orbitron', monospace";
    if (font === 'Inter')    return "'Inter', sans-serif";
    return `'${font}', sans-serif`;
  }

  function renderPromo(data) {
    // Build a cheap cache key — only re-render DOM when content actually changes
    const key = JSON.stringify({
      seg: data.promoSegments,
      txt: data.promoText,
      sty: data.promoStyle
    });
    if (key === lastPromoKey) return; // nothing changed, leave DOM alone
    lastPromoKey = key;

    const block = document.getElementById('promo-block');
    block.innerHTML = '';

    const style    = data.promoStyle || {};
    const fontSize = (style.size || 24) + 'px';
    const cssFont  = getCssFont(style.font);
    const glowStr  = style.glowStrength != null ? style.glowStrength : 8;
    const glowClr  = style.glowColor  || '#ffffff';
    const shadow   = `0 0 ${glowStr}px ${glowClr}, 0 0 ${glowStr * 2}px ${glowClr}`;

    // Prefer per-word segment data
    if (data.promoSegments && data.promoSegments.length > 0) {
      data.promoSegments.forEach(line => {
        const lineEl = document.createElement('div');
        lineEl.className = 'promo-line';
        line.forEach(seg => {
          const span = document.createElement('span');
          span.textContent = seg.text;
          span.style.cssText = `
            font-family: ${cssFont};
            font-size: ${fontSize};
            font-weight: 700;
            color: ${seg.color};
            text-shadow: ${shadow};
            letter-spacing: 2px;
            line-height: 1.4;
            white-space: nowrap;
          `;
          lineEl.appendChild(span);
        });
        block.appendChild(lineEl);
      });
      return;
    }

    // Fallback: plain promoText
    if (data.promoText) {
      const defColor = style.color || '#ffffff';
      data.promoText.split('\n').forEach(line => {
        const lineEl = document.createElement('div');
        lineEl.className = 'promo-line';
        lineEl.style.cssText = `
          font-family: ${cssFont};
          font-size: ${fontSize};
          font-weight: 700;
          color: ${defColor};
          text-shadow: ${shadow};
          letter-spacing: 2px;
          line-height: 1.5;
        `;
        lineEl.textContent = line;
        block.appendChild(lineEl);
      });
    }
  }

  // ── DONORS ───────────────────────────────────────────────────────────────────
  function renderDonors(data) {
    const list = document.getElementById('donators-list');
    if (!data.donors || data.donors.length === 0) {
      list.innerHTML = '<div class="empty-state">NO DONATORS YET</div>';
      return;
    }
    list.innerHTML = '';
    data.donors.slice(0, 10).forEach((d, i) => {
      const card = document.createElement('div');
      card.className = 'donor-card';
      card.style.animationDelay = (i * 0.07) + 's';
      card.innerHTML = `
        <div class="donor-rank">#${i + 1}</div>
        <div class="donor-info"><div class="donor-name">${d.name}</div></div>
        ${(data.showAmounts !== false) && d.amount > 0 ? `<div class="donor-amount">${fmtAmt(d.amount)}</div>` : ''}
      `;
      list.appendChild(card);
    });
  }

  // ── BOOT ─────────────────────────────────────────────────────────────────────
  fetchState();
  setInterval(fetchState, 1500);
</script>
</body>
</html>
